apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "company-page.fullname" . }}-nginx
  labels:
    {{- include "company-page.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr notice;
    events {
      worker_connections 1024;
    }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      sendfile on;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen {{ .Values.service.targetPort }};
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        {{- if .Values.auth.enabled }}
        location /api/auth/ {
          access_log off;
          proxy_pass http://{{ include "company-page.fullname" . }}-auth:8080;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        {{- else }}
        location = /api/auth/session { default_type application/json; add_header Cache-Control no-store; return 200 '{"authenticated":false}'; }
        location = /api/auth/providers { default_type application/json; add_header Cache-Control no-store; return 200 '[]'; }
        location /api/auth/ { return 503; }
        {{- end }}
        {{- if .Values.idp.enabled }}
        location /__test/idp/ {
          access_log off;
          proxy_pass http://{{ include "company-page.fullname" . }}-idp:9000/;
          proxy_set_header Host $http_host;
        }
        {{- end }}
        location / {
          try_files $uri $uri/ =404;
        }
      }
    }
