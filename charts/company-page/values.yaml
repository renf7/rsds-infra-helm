# Number of pod replicas.
replicaCount: 1

image:
  repository: renf7/rsds-infra-company-page
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  # nginx runs without root or privileged-port capabilities.
  targetPort: 8080

ingress:
  enabled: true
  # Provided by the AWS Load Balancer Controller (must already be installed).
  className: alb
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: rsdsoftware-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    # Redirect all HTTP traffic to HTTPS (port 443).
    alb.ingress.kubernetes.io/ssl-redirect: '443'
  # ACM certificate ARN covering rsdsoftware.eu and www.rsdsoftware.eu (in eu-central-1).
  # Replace ACCOUNT_ID and CERTIFICATE_ID with your real values, or override via --set.
  certificateArn: "arn:aws:acm:eu-central-1:472151629401:certificate/ce10b8f4-07e1-41df-adf8-6dc0df2dc1a5"
  hosts:
    - host: rsdsoftware.eu
      paths:
        - path: /
          pathType: Prefix
    - host: www.rsdsoftware.eu
      paths:
        - path: /
          pathType: Prefix

# Local ephemeral storage covers the bounded /tmp volume and container logs.
# Tune these values for the deployment workload; keep a positive storage limit.
resources:
  requests:
    ephemeral-storage: 640Mi
  limits:
    ephemeral-storage: 1280Mi

# Standard pod scheduling controls.
nodeSelector: {}

tolerations: []

affinity: {}

# Authentication is optional until all production registrations/secrets are configured.
auth:
  enabled: false
  local: false
  image:
    repository: renf7/rsds-infra-auth-service
    tag: latest
    pullPolicy: IfNotPresent
  signingSecretName: ''
  trustSecretName: ''
  providerSecretName: ''
  serviceAccountName: ''
  region: eu-central-1
  table: rsds-infra
# Ephemeral test database and provider boundary; template rejects non-local use.
dynamodb:
  enabled: false
  image: amazon/dynamodb-local:3.2.0@sha256:f57a1e8cff92471f76fe826045418e28769ab486cefcbecdbc0cae7bbe8e0a02
idp:
  enabled: false
  image:
    repository: rsds-local/rsds-infra-local
    tag: latest
    pullPolicy: Never
