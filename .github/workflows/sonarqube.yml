name: SonarQube Cloud
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '47 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Sonar analysis and quality gate
    # Validate repository configuration inside the job so missing settings fail visibly.
    # Fork PRs do not receive SONAR_TOKEN; never use pull_request_target to expose it.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify manually configured public project without credentials
        run: |
          curl --fail --silent --show-error --max-time 30 'https://sonarcloud.io/api/components/show?component=rsds-infra-helm' | jq -e '.component.visibility == "public"' || {
            echo 'Owner must configure the existing Sonar project Public. CI never creates projects or changes visibility.'
            exit 1
          }
      - name: Analyze and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=rsds-infra-helm
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300