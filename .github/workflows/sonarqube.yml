name: SonarQube Cloud
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '47 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Sonar analysis and quality gate
    # Validate repository configuration inside the job so missing settings fail visibly.
    # Fork PRs do not receive SONAR_TOKEN; never use pull_request_target to expose it.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate connection configuration
        shell: bash
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Missing SONAR_TOKEN repository Actions secret. Store the token in Secrets, not Variables. No token value is logged."
            exit 1
          fi
          test -n "$SONAR_PROJECT_KEY" || { echo 'Repository name is unavailable'; exit 1; }
      - name: Ensure existing Sonar project is public
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          if os.environ["REPOSITORY_PRIVATE"].lower() != "false":
              raise SystemExit("Refusing to publish analysis for a non-public GitHub repository")
          base = "https://sonarcloud.io"
          key = os.environ["SONAR_PROJECT_KEY"]
          auth = base64.b64encode((os.environ["SONAR_TOKEN"] + ":").encode()).decode()
          headers = {"Authorization": "Basic " + auth}
          url = base + "/api/components/show?" + urllib.parse.urlencode({"component": key})
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  component = json.load(response)["component"]
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print("Project not found; scanner will request public visibility on creation")
                  raise SystemExit(0)
              raise SystemExit("Sonar project lookup failed with HTTP " + str(error.code))
          if component.get("visibility") == "public":
              print("Sonar project is already public")
          else:
              data = urllib.parse.urlencode({"project": key, "visibility": "public"}).encode()
              request = urllib.request.Request(base + "/api/projects/update_visibility", data=data, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print("Sonar project changed to public")
              except urllib.error.HTTPError as error:
                  raise SystemExit("Cannot set public visibility (HTTP " + str(error.code) + "). A project administrator must set Administration > Permissions > Public; do not grant a broad token just for CI.")
          PY
      - name: Analyze and wait for the quality gate
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        with:
          args: >
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Verify public visibility after first analysis
        if: ${{ always() && env.SONAR_TOKEN != '' }}
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          if os.environ["REPOSITORY_PRIVATE"].lower() != "false":
              raise SystemExit("Refusing to publish analysis for a non-public GitHub repository")
          base = "https://sonarcloud.io"
          key = os.environ["SONAR_PROJECT_KEY"]
          auth = base64.b64encode((os.environ["SONAR_TOKEN"] + ":").encode()).decode()
          headers = {"Authorization": "Basic " + auth}
          url = base + "/api/components/show?" + urllib.parse.urlencode({"component": key})
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  component = json.load(response)["component"]
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print("Project not found; scanner will request public visibility on creation")
                  raise SystemExit(0)
              raise SystemExit("Sonar project lookup failed with HTTP " + str(error.code))
          if component.get("visibility") == "public":
              print("Sonar project is already public")
          else:
              data = urllib.parse.urlencode({"project": key, "visibility": "public"}).encode()
              request = urllib.request.Request(base + "/api/projects/update_visibility", data=data, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print("Sonar project changed to public")
              except urllib.error.HTTPError as error:
                  raise SystemExit("Cannot set public visibility (HTTP " + str(error.code) + "). A project administrator must set Administration > Permissions > Public; do not grant a broad token just for CI.")
          PY
      - name: Report quality gate conditions
        if: ${{ always() && env.SONAR_TOKEN != '' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          params = {"projectKey": os.environ["SONAR_PROJECT_KEY"]}
          if os.environ.get("PR_NUMBER"):
              params["pullRequest"] = os.environ["PR_NUMBER"]
          auth = base64.b64encode((os.environ["SONAR_TOKEN"] + ":").encode()).decode()
          request = urllib.request.Request("https://sonarcloud.io/api/qualitygates/project_status?" + urllib.parse.urlencode(params), headers={"Authorization": "Basic " + auth})
          with urllib.request.urlopen(request, timeout=30) as response:
              status = json.load(response)["projectStatus"]
          print("Quality gate:", status["status"])
          for condition in status.get("conditions", []):
              print(condition["metricKey"], "status=" + condition["status"], "actual=" + condition.get("actualValue", "n/a"), "threshold=" + condition.get("errorThreshold", "n/a"))
          PY
